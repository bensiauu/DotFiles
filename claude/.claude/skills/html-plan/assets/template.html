<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #d18616;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { color: #f0f6fc; font-size: 1.8rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
  h2 { color: #f0f6fc; font-size: 1.4rem; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  h3 { color: var(--accent); font-size: 1.1rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  h4 { color: var(--text); font-size: 1rem; margin-top: 1rem; margin-bottom: 0.3rem; }
  p, li { margin-bottom: 0.4rem; }
  ul, ol { padding-left: 1.5rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { background: var(--surface); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
    font-size: 0.85rem;
    line-height: 1.5;
    margin: 0.75rem 0;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
  th { background: var(--surface); color: #f0f6fc; font-weight: 600; }
  tr:nth-child(even) { background: rgba(22, 27, 34, 0.5); }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-right: 0.3rem;
  }
  .badge-green { background: rgba(63,185,80,0.2); color: var(--green); border: 1px solid rgba(63,185,80,0.4); }
  .badge-yellow { background: rgba(210,153,34,0.2); color: var(--yellow); border: 1px solid rgba(210,153,34,0.4); }
  .badge-red { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid rgba(248,81,73,0.4); }
  .badge-blue { background: rgba(88,166,255,0.2); color: var(--accent); border: 1px solid rgba(88,166,255,0.4); }
  .badge-purple { background: rgba(188,140,255,0.2); color: var(--purple); border: 1px solid rgba(188,140,255,0.4); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin: 0.75rem 0;
  }
  .card-warn { border-left: 3px solid var(--yellow); }
  .card-danger { border-left: 3px solid var(--red); }
  .card-info { border-left: 3px solid var(--accent); }
  .card-success { border-left: 3px solid var(--green); }
  .file-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.75rem;
  }
  .file-header + pre { margin-top: 0; border-radius: 0 0 6px 6px; }
  .copy-btn {
    background: var(--border);
    color: var(--text);
    border: none;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .copy-btn:hover { background: #484f58; }
  .phase-nav {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 0;
    z-index: 10;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .phase-nav a {
    padding: 0.3rem 0.8rem;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .phase-nav a:hover { background: var(--border); text-decoration: none; }
  .checklist { list-style: none; padding-left: 0; }
  .checklist li { padding: 0.3rem 0; padding-left: 1.5rem; position: relative; }
  .checklist li::before { content: '\2610'; position: absolute; left: 0; color: var(--text-muted); }
  details { margin: 0.5rem 0; }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-weight: 500;
    padding: 0.3rem 0;
  }
  details summary:hover { text-decoration: underline; }
  .diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 0.85rem;
    line-height: 1.4;
    white-space: pre;
    color: var(--text);
    margin: 0.75rem 0;
  }
  .toc { columns: 2; column-gap: 2rem; }
  .toc li { break-inside: avoid; }
  @media (max-width: 768px) {
    body { padding: 1rem; }
    .toc { columns: 1; }
    table { font-size: 0.8rem; }
    th, td { padding: 0.3rem 0.5rem; }
  }
</style>
<script>
function copyCode(btn) {
  const pre = btn.closest('.file-header').nextElementSibling;
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}
</script>
</head>
<body>

<h1>__TITLE__</h1>
<p style="color: var(--text-muted);">__SUBTITLE__</p>

<nav class="phase-nav">
  __NAV__
</nav>

__BODY__

</body>
</html>
